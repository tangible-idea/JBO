<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #F3F0E7;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-duration="40"
      data-fps="30"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="el-01-later"
        class="scene"
        data-composition-id="01-later"
        data-composition-src="compositions/frames/01-later.html"
        data-start="0"
        data-duration="6"
        data-track-index="1"
      ></div>

      <div
        id="el-02-meet"
        class="scene"
        data-composition-id="02-meet"
        data-composition-src="compositions/frames/02-meet.html"
        data-start="6"
        data-duration="4"
        data-track-index="1"
      ></div>

      <div
        id="el-03-save"
        class="scene"
        data-composition-id="03-save"
        data-composition-src="compositions/frames/03-save.html"
        data-start="10"
        data-duration="8"
        data-track-index="1"
      ></div>

      <div
        id="el-04-ways"
        class="scene"
        data-composition-id="04-ways"
        data-composition-src="compositions/frames/04-ways.html"
        data-start="18"
        data-duration="10"
        data-track-index="1"
      ></div>

      <div
        id="el-05-control"
        class="scene"
        data-composition-id="05-control"
        data-composition-src="compositions/frames/05-control.html"
        data-start="28"
        data-duration="6"
        data-track-index="1"
      ></div>

      <div
        id="el-06-finale"
        class="scene"
        data-composition-id="06-finale"
        data-composition-src="compositions/frames/06-finale.html"
        data-start="34"
        data-duration="6"
        data-track-index="1"
      ></div>

      <video id="s4-video0" src="capture/assets/videos/mode-a-en.mp4" data-media-start="0.7" muted playsinline
        class="clip"
        style="position:absolute;left:108px;top:328px;width:1160px;height:544px;object-fit:contain"
        data-start="18"
        data-duration="2.5"
        data-track-index="4002"
      ></video>

      <video id="s4-video1" src="capture/assets/videos/mode-b-en.mp4" data-media-start="0.7" muted playsinline
        class="clip"
        style="position:absolute;left:108px;top:328px;width:1160px;height:544px;object-fit:contain"
        data-start="20.5"
        data-duration="2.5"
        data-track-index="4002"
      ></video>

      <video id="s4-video2" src="capture/assets/videos/mode-c-en.mp4" data-media-start="0.7" muted playsinline
        class="clip"
        style="position:absolute;left:108px;top:328px;width:1160px;height:544px;object-fit:contain"
        data-start="23"
        data-duration="2.5"
        data-track-index="4002"
      ></video>

      <video id="s4-video3" src="capture/assets/videos/mode-d-en.mp4" data-media-start="0.7" muted playsinline
        class="clip"
        style="position:absolute;left:108px;top:328px;width:1160px;height:544px;object-fit:contain"
        data-start="25.5"
        data-duration="2.5"
        data-track-index="4002"
      ></video>

      <audio id="tidymark-foley" src="assets/audio/foley.wav" data-start="0" data-duration="40" data-track-index="12" data-volume="0.5"></audio>
      <!-- BGM -->
      <audio
        id="el-bgm"
        src="assets/audio/music.wav"
        data-start="0"
        data-duration="40"
        data-track-index="11"
        data-volume="0.85"
      ></audio>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
