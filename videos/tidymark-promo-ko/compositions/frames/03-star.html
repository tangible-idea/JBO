  <script>
    (() => {
      const CHIPS = [
        ["라자냐 레시피", "#f5c451"], ["리스본 3일 일정", "#c8f25a"], ["러닝화 리뷰", "#a9d8ff"],
        ["제목 없음", "#dcd7c9"], ["바나나 브레드", "#f5c451"], ["스탠딩 책상 비교", "#cbb6ff"],
        ["아이 수면 스케줄", "#cbb6ff"], ["10K 훈련 계획", "#a9d8ff"], ["새 탭", "#dcd7c9"],
        ["주방 타일 고르기", "#cbb6ff"], ["리스본 맛집 지도", "#c8f25a"], ["2025 연말정산", "#f5c451"],
        ["반려식물 키우기", "#c8f25a"], ["캠핑 체크리스트", "#a9d8ff"], ["나중에 읽기: AI 에이전트", "#cbb6ff"],
        ["사워도우 스타터", "#f5c451"], ["웨딩홀 비교", "#cbb6ff"], ["마라톤 접수", "#a9d8ff"],
        ["자전거 수리 영상", "#a9d8ff"], ["포르투 항공권 특가", "#c8f25a"],
      ];
      const spot = (i) => {
        const a = i * 2.399963;
        const r = Math.sqrt((i + 0.6) / CHIPS.length);
        return { x: 960 + Math.cos(a) * r * 700 - 150, y: 620 + Math.sin(a) * r * 255 - 30, rot: ((i * 37) % 23) - 11 };
      };
      const root = document.getElementById("p3-chips");
      const tl = gsap.timeline({ paused: true });
      // The star streaks left → right across the heap; each chip is flung away as it passes.
      const SWEEP_START = 0.12, SWEEP_DUR = 0.8, FROM_X = -420, TO_X = 2240;
      gsap.set("#p3-star", { x: FROM_X, y: 470, rotation: 0, scale: 1 });
      tl.to("#p3-star", { x: TO_X, duration: SWEEP_DUR, ease: "power1.in" }, SWEEP_START);
      CHIPS.forEach(([label, color], i) => {
        const el = document.createElement("div");
        el.className = "p3-chip";
        el.style.setProperty("--c", color);
        el.style.zIndex = String(10 + i);
        el.innerHTML = "<i></i>" + label;
        el.dataset.layoutAllowOverlap = "";
        el.dataset.layoutAllowOcclusion = "";
        root.appendChild(el);
        const s = spot(i);
        gsap.set(el, { x: s.x, y: s.y, rotation: s.rot });
        // when does the star (moving with power1.in) reach this chip? solve x(t) ≈ chip x
        const frac = Math.sqrt(Math.max(0, Math.min(1, (s.x + 100 - FROM_X) / (TO_X - FROM_X))));
        const hit = SWEEP_START + frac * SWEEP_DUR;
        tl.to(el, { x: s.x + 1300 + (i % 4) * 120, y: s.y - 260 + (i % 5) * 130, rotation: s.rot + 140 + i * 9, duration: 0.6, ease: "power2.out" }, hit);
      });
      tl.to("#p3-count", { x: 1200, rotation: 60, duration: 0.55, ease: "power2.out" }, SWEEP_START + 0.52);

      // The star comes back from the top, spins to the centre over a lime burst.
      tl.fromTo("#p3-burst", { scale: 0 }, { scale: 1, duration: 0.55, ease: "back.out(1.6)" }, 1.15);
      tl.fromTo("#p3-star", { x: 810, y: -340, rotation: -200, scale: 0.6 }, { x: 810, y: 250, rotation: 0, scale: 1, duration: 0.7, ease: "back.out(1.8)", immediateRender: false }, 1.2);
      tl.fromTo("#p3-word", { y: 50, opacity: 0, scale: 0.9 }, { y: 0, opacity: 1, scale: 1, duration: 0.45, ease: "back.out(2.2)" }, 1.85);
      tl.fromTo("#p3-tag", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "back.out(2)" }, 2.25);
      tl.to("#p3-star", { rotation: 12, scale: 1.06, duration: 0.5, ease: "sine.inOut" }, 2.7);
      window.__timelines["03-star"] = tl;
    })();
  </script>
