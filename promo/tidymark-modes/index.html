<!doctype html>
<html lang="ko" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Pretendard Variable";
        src: url("assets/fonts/PretendardVariable.woff2") format("woff2");
        font-weight: 45 920;
        font-display: block;
      }
      :root {
        --paper: #f3f0e7;
        --paper-2: #ebe7db;
        --card: #fffdf7;
        --ink: #18181a;
        --ink-2: #3a3935;
        --muted: #5c5850;
        --line: #dcd7c9;
        --lime: #c8f25a;
        --lime-soft: #eef9cf;
        --sky: #a9d8ff;
        --sky-soft: #e3f2ff;
        --amber: #f5c451;
        --amber-soft: #fbf0d4;
        --violet: #cbb6ff;
        --violet-soft: #f0eaff;
        --mono: ui-monospace, "SF Mono", Menlo, monospace;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--paper);
        color: var(--ink);
        font-family: "Pretendard Variable", ui-sans-serif, system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      #root { position: relative; width: 100%; height: 100%; }
      .clip { position: absolute; inset: 0; }
      .abs { position: absolute; }

      /* intro title */
      #intro { left: 0; right: 0; top: 400px; text-align: center; z-index: 5; }
      #intro .card { display: inline-block; border-radius: 28px; padding: 40px 64px; background: var(--ink); color: var(--paper); }
      #intro p { font-size: 74px; font-weight: 850; letter-spacing: -0.045em; line-height: 1.15; }
      #intro p b { color: var(--lime); font-weight: inherit; }

      /* mode header */
      .head { left: 140px; top: 104px; display: flex; align-items: center; gap: 30px; }
      .head .letter {
        width: 104px; height: 104px; border: 4px solid var(--ink); border-radius: 10px 28px 28px 28px;
        background: var(--accent); font-family: var(--mono); font-size: 54px; font-weight: 800;
        display: flex; align-items: center; justify-content: center;
      }
      .head strong { display: block; font-size: 64px; font-weight: 850; letter-spacing: -0.045em; line-height: 1; }
      .head span { display: block; margin-top: 14px; font-size: 29px; font-weight: 550; color: var(--ink-2); letter-spacing: -0.02em; }
      #steps { right: 140px; top: 136px; display: flex; gap: 12px; }
      #steps i {
        width: 56px; height: 40px; border: 3px solid var(--ink); border-radius: 12px; font-style: normal;
        font-family: var(--mono); font-size: 20px; font-weight: 800; display: flex; align-items: center; justify-content: center;
        background: var(--card); color: var(--muted);
      }

      /* folder columns */
      .col {
        width: 380px; height: 540px; top: 350px; border: 3px solid var(--ink); border-radius: 6px 24px 24px 24px;
        background: linear-gradient(180deg, var(--soft), var(--card) 60%); box-shadow: 8px 8px 0 var(--accent);
        padding: 24px 22px;
      }
      .col .tab {
        position: absolute; top: -24px; left: -3px; width: 120px; height: 24px; border: 3px solid var(--ink); border-bottom: 0;
        border-radius: 10px 14px 0 0; background: var(--accent);
      }
      .col .path { font-family: var(--mono); font-size: 18px; font-weight: 700; color: var(--muted); letter-spacing: 0.02em; }
      .col strong { display: block; margin-top: 6px; font-size: 34px; font-weight: 850; letter-spacing: -0.035em; }
      .badge {
        position: absolute; top: 22px; right: 20px; border-radius: 999px; padding: 6px 12px;
        background: var(--ink); color: var(--lime); font-size: 17px; font-weight: 800;
      }
      .badge.keep { background: var(--paper-2); color: var(--ink-2); }
      .ghost {
        position: absolute; left: 20px; width: 340px; height: 60px; border: 2px dashed #c9c4b6; border-radius: 14px;
        display: flex; align-items: center; gap: 12px; padding: 0 18px; font-size: 22px; font-weight: 650; color: #8c877b;
      }
      .ghost::before { content: ""; width: 14px; height: 14px; border-radius: 4px; background: #d8d3c4; }

      /* timeline (mode D) */
      #axis { left: 140px; top: 972px; width: 1640px; height: 4px; background: var(--ink); transform-origin: left center; }
      .tick { top: 988px; width: 80px; margin-left: -40px; text-align: center; font-family: var(--mono); font-size: 20px; font-weight: 700; color: var(--muted); }
      #cluster {
        left: 1556px; top: 700px; width: 300px; height: 240px; border: 4px dashed #6a4bc4; border-radius: 22px; background: rgba(203, 182, 255, 0.18);
      }
      #cluster-label {
        left: 1440px; top: 640px; width: 420px; text-align: right; font-size: 24px; font-weight: 800; color: #3b2470;
      }
      #project {
        left: 1040px; top: 300px; width: 740px; height: 300px; border: 3px solid var(--ink); border-radius: 6px 24px 24px 24px;
        background: linear-gradient(180deg, var(--violet-soft), var(--card) 70%); box-shadow: 8px 8px 0 var(--violet); padding: 22px 26px;
      }
      #project .tab { position: absolute; top: -24px; left: -3px; width: 120px; height: 24px; border: 3px solid var(--ink); border-bottom: 0; border-radius: 10px 14px 0 0; background: var(--violet); }
      #project .path { font-family: var(--mono); font-size: 18px; font-weight: 700; color: var(--muted); }
      #project strong { display: block; margin-top: 6px; font-size: 34px; font-weight: 850; letter-spacing: -0.035em; }

      /* bookmark chips */
      .chip {
        left: 0; top: 0; width: 340px; height: 60px; z-index: 4; border: 2px solid var(--line); border-radius: 14px;
        display: flex; align-items: center; gap: 12px; padding: 0 18px; background: var(--card);
        font-size: 23px; font-weight: 700; letter-spacing: -0.02em; white-space: nowrap;
        box-shadow: 0 10px 24px -16px rgba(0, 0, 0, 0.5); transform-origin: left top;
      }
      .chip i { width: 16px; height: 16px; border-radius: 5px; background: var(--c); flex: none; }

      /* end card */
      #end { background: var(--ink); color: var(--paper); display: flex; flex-direction: column; align-items: center; justify-content: center; }
      #end .brand { display: flex; align-items: center; gap: 22px; }
      #end .brand img { width: 104px; height: 104px; }
      #end .brand strong { font-size: 68px; font-weight: 900; letter-spacing: -0.05em; }
      #end p { margin-top: 40px; font-size: 56px; font-weight: 850; letter-spacing: -0.04em; text-align: center; line-height: 1.2; }
      #end p b { color: var(--lime); font-weight: inherit; }
      #end small { margin-top: 22px; font-size: 28px; font-weight: 550; color: #cfcabc; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="modes" data-start="0" data-duration="19" data-width="1920" data-height="1080">
      <section id="stage" class="clip" data-start="0" data-duration="17" data-track-index="0">
        <div id="intro" class="abs"><div class="card"><p>같은 북마크 10개,<br /><b>네 가지</b>로 정리해 볼게요</p></div></div>

        <div id="steps" class="abs"><i>A</i><i>B</i><i>C</i><i>D</i></div>

        <div id="head-a" class="abs head" data-layout-allow-overlap style="--accent:var(--lime)"><div class="letter">A</div><div><strong>새 폴더로</strong><span>카테고리만 정하면, 폴더를 새로 만들어 나눠 담아요</span></div></div>
        <div id="head-b" class="abs head" data-layout-allow-overlap style="--accent:var(--sky)"><div class="letter">B</div><div><strong>기존 폴더로</strong><span>지금 폴더는 그대로. 흩어진 북마크만 제자리로</span></div></div>
        <div id="head-c" class="abs head" data-layout-allow-overlap style="--accent:var(--amber)"><div class="letter">C</div><div><strong>쓰임새로</strong><span>마지막으로 연 날짜로 나눠요. AI 없이 규칙만으로</span></div></div>
        <div id="head-d" class="abs head" data-layout-allow-overlap style="--accent:var(--violet)"><div class="letter">D</div><div><strong>프로젝트로</strong><span>며칠 새 몰아서 저장한 북마크를 목적별로 묶어요</span></div></div>

        <div id="cols"></div>

        <div id="axis" class="abs"></div>
        <div id="ticks"></div>
        <div id="cluster" class="abs"></div>
        <div id="cluster-label" class="abs">사흘 동안 3개 저장</div>
        <div id="project" class="abs" data-layout-allow-overlap data-layout-allow-occlusion><div class="tab" data-layout-allow-overflow></div><p class="path">Tidymark / Projects /</p><strong>2026-09 · 리스본 여행</strong></div>

        <div id="chips"></div>
      </section>

      <section id="end" class="clip" data-start="17" data-duration="2" data-track-index="0">
        <div class="brand" id="end-brand"><img src="assets/logo.svg" alt="" /><strong>Tidymark</strong></div>
        <p id="end-line">원하는 방식으로, <b>한 번에</b></p>
        <small id="end-sub">적용하기 전에 미리 보고, 언제든 되돌릴 수 있어요</small>
      </section>
    </div>

    <script>
      const COL_X = [140, 560, 980, 1400];
      const SLOT_Y = (slot) => 450 + slot * 76;
      const MONTH_X = (m) => 260 + ((m - 1) / 8) * 1440; // 1월..9월 centers on the axis
      const TOPIC = { food: "var(--amber)", fit: "var(--sky)", trip: "var(--lime)", home: "var(--violet)" };

      // [title, topic, A column, B column, C column, D month]
      const chips = [
        ["라자냐 레시피", "food", 0, 0, 0, 5],
        ["바나나 브레드", "food", 0, 0, 2, 2],
        ["러닝화 리뷰", "fit", 1, 1, 1, 3],
        ["10K 훈련 계획", "fit", 1, 1, 0, 6],
        ["리스본 3일 일정", "trip", 2, 2, 0, 9],
        ["리스본 맛집 지도", "trip", 2, 2, 0, 9],
        ["리스본 숙소 비교", "trip", 2, 2, 2, 9],
        ["주방 타일 고르기", "home", 3, 3, 3, 1],
        ["스탠딩 책상 비교", "home", 3, 3, 2, 4],
        ["아이 수면 스케줄", "home", 3, 3, 1, 7],
      ];

      const modes = {
        a: { accent: "var(--lime)", soft: "var(--lime-soft)", badge: "+ 새 폴더", cols: [["Tidymark /", "요리"], ["Tidymark /", "운동"], ["Tidymark /", "여행"], ["Tidymark /", "집·생활"]] },
        b: { accent: "var(--sky)", soft: "var(--sky-soft)", badge: "원래 있던 폴더", keep: true,
             cols: [["북마크바 /", "레시피"], ["북마크바 /", "러닝"], ["여행 /", "포르투갈"], ["북마크바 /", "우리 집"]],
             ghosts: ["김치찌개 황금비율", "마라톤 접수 일정", "포르투 와이너리", "이사 체크리스트"] },
        c: { accent: "var(--amber)", soft: "var(--amber-soft)",
             cols: [["최근 30일 안에 연 것", "Active"], ["30~180일 전에 연 것", "Occasional"], ["저장만 하고 안 연 것", "Someday"], ["180일 넘게 안 연 것", "Archive"]] },
      };

      // Build folder columns for modes A–C.
      const colsRoot = document.getElementById("cols");
      for (const [key, mode] of Object.entries(modes)) {
        mode.cols.forEach(([path, name], i) => {
          const col = document.createElement("div");
          col.className = `abs col col-${key}`;
          col.dataset.layoutAllowOverlap = "";
          col.dataset.layoutAllowOcclusion = "";
          col.style.cssText = `left:${COL_X[i]}px;--accent:${mode.accent};--soft:${mode.soft}`;
          col.innerHTML = `<div class="tab" data-layout-allow-overflow></div><p class="path">${path}</p><strong>${name}</strong>` +
            (mode.badge ? `<span class="badge${mode.keep ? " keep" : ""}">${mode.badge}</span>` : "");
          if (mode.ghosts) col.insertAdjacentHTML("beforeend", `<div class="ghost" style="top:${SLOT_Y(0) - 350 - 3}px">${mode.ghosts[i]}</div>`);
          colsRoot.append(col);
        });
      }

      // Month ticks for mode D.
      const ticksRoot = document.getElementById("ticks");
      for (let m = 1; m <= 9; m++) {
        ticksRoot.insertAdjacentHTML("beforeend", `<div class="abs tick" style="left:${MONTH_X(m)}px">${m}월</div>`);
      }

      // Chips.
      const chipsRoot = document.getElementById("chips");
      const chipEls = chips.map(([title, topic], i) => {
        const el = document.createElement("div");
        el.className = "abs chip";
        el.dataset.layoutAllowOverlap = "";
        el.dataset.layoutAllowOcclusion = "";
        el.id = `chip-${i}`;
        el.style.setProperty("--c", TOPIC[topic]);
        el.innerHTML = `<i></i>${title}`;
        chipsRoot.append(el);
        return el;
      });

      // Target positions per mode (x, y, scale).
      function columnTargets(colIndex, slotOffset = 0) {
        const used = [0, 0, 0, 0];
        return chips.map((chip) => {
          const col = chip[colIndex];
          const slot = slotOffset + used[col]++;
          return { x: COL_X[col] + 20, y: SLOT_Y(slot), scale: 1 };
        });
      }
      const targets = {
        a: columnTargets(2),
        b: columnTargets(3, 1),
        c: columnTargets(4),
      };
      // D: small chips on the timeline; the September trio stacks inside the cluster box.
      let septRow = 0;
      targets.d = chips.map((chip, i) => {
        const month = chip[5];
        if (month === 9) return { x: 1576, y: 724 + septRow++ * 70, scale: 0.76 };
        return { x: MONTH_X(month) - 112, y: month % 2 ? 790 : 870, scale: 0.66 };
      });
      targets.project = chips.map((chip, i) => ({ x: 1066, y: 392 + (i - 4) * 64, scale: 0.82 }));

      // Deterministic scatter for the intro.
      const scatter = chips.map((_, i) => {
        const angle = (i * 137.5 * Math.PI) / 180;
        return { x: 790 + Math.cos(angle) * (560 + (i % 3) * 90), y: 480 + Math.sin(angle) * 330, rotation: (i % 2 ? 1 : -1) * (4 + (i % 4) * 3) };
      });

      const tl = gsap.timeline({ paused: true });
      const ease = "power3.out";
      const moveChips = (key, at, { stagger = 0.045, only } = {}) => {
        chipEls.forEach((el, i) => {
          if (only && !only.includes(i)) return;
          const t = targets[key][i];
          tl.to(el, { x: t.x, y: t.y, scale: t.scale, rotation: 0, duration: 0.8, ease: "power3.inOut" }, at + i * stagger);
        });
      };
      const showHead = (id, at) => tl.fromTo(id, { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.5, ease }, at);
      const hideHead = (id, at) => tl.to(id, { opacity: 0, x: -30, duration: 0.3, ease: "power2.in" }, at);
      const stepOn = (n, at) => {
        tl.to(`#steps i:nth-child(${n})`, { backgroundColor: "#18181a", color: "#c8f25a", scale: 1.08, duration: 0.3 }, at);
        if (n > 1) tl.to(`#steps i:nth-child(${n - 1})`, { backgroundColor: "#fffdf7", color: "#5c5850", scale: 1, duration: 0.3 }, at);
      };

      // Initial state.
      gsap.set(["#head-a", "#head-b", "#head-c", "#head-d", "#steps", ".col", "#axis", "#ticks .tick", "#cluster", "#cluster-label", "#project"], { opacity: 0 });
      gsap.set("#axis", { scaleX: 0 });
      chipEls.forEach((el, i) => gsap.set(el, { x: scatter[i].x, y: scatter[i].y, rotation: scatter[i].rotation, scale: 1, opacity: 0 }));

      // 0 · intro: the pile drops in, then the promise.
      chipEls.forEach((el, i) => tl.fromTo(el, { opacity: 0, y: scatter[i].y - 80 }, { opacity: 1, y: scatter[i].y, duration: 0.6, ease: "back.out(1.6)" }, 0.05 + i * 0.05));
      tl.fromTo("#intro", { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.6, ease: "back.out(1.6)" }, 0.5);
      tl.to("#intro", { opacity: 0, y: -30, duration: 0.35, ease: "power2.in" }, 2.0);

      // A · new folders pop into existence, chips file in by topic.
      tl.to("#steps", { opacity: 1, duration: 0.4 }, 2.1);
      stepOn(1, 2.2);
      showHead("#head-a", 2.2);
      tl.fromTo(".col-a", { opacity: 0, scale: 0.6, y: 40 }, { opacity: 1, scale: 1, y: 0, duration: 0.55, ease: "back.out(1.7)", stagger: 0.09 }, 2.35);
      tl.fromTo(".col-a .badge", { scale: 0 }, { scale: 1, duration: 0.35, ease: "back.out(2.4)", stagger: 0.09 }, 2.75);
      moveChips("a", 2.8);

      // B · folders were already there (with their old bookmarks); strays slot in.
      hideHead("#head-a", 5.5);
      tl.to(".col-a", { opacity: 0, duration: 0.35 }, 5.5);
      stepOn(2, 5.7);
      showHead("#head-b", 5.7);
      tl.fromTo(".col-b", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 5.7);
      moveChips("b", 6.1);

      // C · same chips, now split by when they were last opened.
      hideHead("#head-b", 9.1);
      tl.to(".col-b", { opacity: 0, duration: 0.35 }, 9.1);
      stepOn(3, 9.3);
      showHead("#head-c", 9.3);
      tl.fromTo(".col-c", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.45, ease, stagger: 0.07 }, 9.3);
      moveChips("c", 9.7);

      // D · lay chips out by save date, spot the burst, file it as a project.
      hideHead("#head-c", 12.7);
      tl.to(".col-c", { opacity: 0, duration: 0.35 }, 12.7);
      stepOn(4, 12.9);
      showHead("#head-d", 12.9);
      tl.to("#axis", { opacity: 1, scaleX: 1, duration: 0.6, ease: "power2.out" }, 12.9);
      tl.to("#ticks .tick", { opacity: 1, duration: 0.3, stagger: 0.04 }, 13.1);
      moveChips("d", 13.1, { stagger: 0.035 });
      tl.fromTo("#cluster", { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(1.8)" }, 14.2);
      tl.fromTo("#cluster-label", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.35, ease }, 14.35);
      tl.fromTo("#project", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5, ease }, 14.8);
      moveChips("project", 15.1, { only: [4, 5, 6], stagger: 0.08 });
      tl.to("#cluster, #cluster-label", { opacity: 0, duration: 0.3 }, 15.2);
      tl.to([0, 1, 2, 3, 7, 8, 9].map((i) => chipEls[i]), { opacity: 0.35, duration: 0.4 }, 15.2);

      // End card.
      tl.fromTo("#end-brand", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5, ease }, 17.05);
      tl.fromTo("#end-line", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5, ease }, 17.25);
      tl.fromTo("#end-sub", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease }, 17.45);

      window.__timelines = window.__timelines || {};
      window.__timelines["modes"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
